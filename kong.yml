# kong.yml - Declarative Configuration for Kong (DB-less Mode)
_format_version: "3.0"

services:
- name: assignment-service
  # The URL of your API running inside the Docker network.
  url: http://my-api:8501

  routes:
  - name: assignment-route
    # Clients access this via http://localhost:8000/api
    paths:
    - /api

  # --- ASSIGNMENT PLUGIN 1: RATE LIMITING (5 requests per minute) ---
  plugins:
  - name: rate-limiting
    config:
      minute: 5
      # Local policy is fine for DB-less mode
      policy: local
      limit_by: ip

  # --- ASSIGNMENT PLUGIN 2: REQUEST SIZE LIMITING (100 kilobytes max) ---
  - name: request-size-limiting
    config:
      allowed_payload_size: 100
      size_unit: kilobytes