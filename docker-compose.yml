version: "3.8"
services:
  # 1. Kong's Database (Starts here, level 1 indentation)
  kong-db:
    image: postgres:15
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: mysecretpassword
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Horizontal separator ---

  # 2. Your API Service (Starts here, level 1 indentation - MUST be aligned with kong-db)
  my-api:
    image: plagiarism-checker-api
    ports:
      - "8501:8501"

  # --- Horizontal separator ---

  # 3. Kong Gateway (Starts here, level 1 indentation - MUST be aligned with kong-db)
  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PASSWORD: mysecretpassword
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8001"
    depends_on:
      kong-db:
        condition: service_healthy
      my-api:
        condition: service_started
    command: "kong start --v"