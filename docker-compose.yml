version: "3.8"
services:
  # 1. Your API Service
  my-api:
    image: plagiarism-checker-api # <-- REPLACE THIS with your actual image name
    ports:
      - "8501:8501"
    # Use restart policy to ensure it comes back up
    restart: always

  # 2. Kong Gateway (DB-less Mode)
  kong:
    image: kong:latest
    environment:
      # Use DB-less mode
      KONG_DATABASE: "off"
      # Point Kong to the declarative configuration file
      KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000" # Client Proxy Port
      - "8001:8001" # Admin Port (for troubleshooting only)
    # Mount the kong.yml file into the container
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    depends_on:
      my-api:
        condition: service_started
    # Simple start command
    command: "kong start"
    restart: always